version: '3.8'

services:
  api:
    build: .
    ports:
      - '4000:4000'
    environment:
      - DATABASE_URL=postgresql://postgres:1234@db:5432/database?schema=public
      - SERVER_URL=${SERVER_URL}
      - CLIENT_URL=${CLIENT_URL}
      - PORT=${PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      - db
      - cache

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: db
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  cache:
    image: redis:7.4-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - cache:/data

volumes:
  db_data:
  cache:
